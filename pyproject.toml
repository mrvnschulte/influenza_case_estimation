[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "influenza-case-estimation"
version = "0.1.0"
description = "Estimates weekly influenza activity, symptomatic cases, and strain-specific case counts from CDC surveillance data."
readme = "README.md"

authors = [
    { name = "Marvin Schulte", email = "marvin.schulte@itwm.fraunhofer.de" }
]

requires-python = ">=3.10"

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["influenza_case_estimation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=influenza_case_estimation --cov-report=term-missing"